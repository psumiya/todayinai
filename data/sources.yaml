# Edit this file to add or remove sources. Every feed URL is pinned here; nothing is guessed at runtime.
# `verified: false` means the URL has not been fetched successfully yet. Run
#   python -m newsletter.check_sources
# on a machine with internet access (the GitHub Action does this) and flip it to true once it passes.
#
# kinds:
#   rss      RSS/Atom feed. Items filtered by publish time.
#   page     Listing page without a feed. New = article link never seen before (first fetch only seeds the ledger).
#   youtube  Channel uploads feed by channel_id. `handle` is used once by check_sources to look the id up.

window_hours: 36

blogs:
  - name: OpenAI
    kind: rss
    url: https://openai.com/news/rss.xml
    verified: true
  - name: Anthropic
    kind: page
    url: https://www.anthropic.com/news
    link_pattern: '^(https://www\.anthropic\.com)?/(news|research)/[a-z0-9-]+/?$'
    verified: true
  - name: Google DeepMind
    kind: rss
    url: https://deepmind.google/blog/rss.xml
    verified: true
  - name: BAIR
    kind: rss
    url: https://bair.berkeley.edu/blog/feed.xml
    verified: true
  - name: Hugging Face
    kind: rss
    url: https://huggingface.co/blog/feed.xml
    verified: true
  - name: The Gradient
    kind: rss
    url: https://thegradient.pub/rss/
    verified: true
  - name: Import AI
    kind: rss
    url: https://importai.substack.com/feed
    verified: true
  - name: The Batch
    kind: page
    url: https://www.deeplearning.ai/the-batch/
    link_pattern: '^(https://www\.deeplearning\.ai)?/the-batch/(issue-|tag/)[a-z0-9-]+/?$'
    verified: true
  - name: AI Weekly
    kind: page
    url: https://aiweekly.co/issues
    link_pattern: '^(https://aiweekly\.co)?/(issues|alerts)/[a-z0-9-]+/?$'
    verified: true
  - name: bycloud
    kind: rss
    url: null   # blog URL not pinned; add it to enable
    verified: false

