name: Daily edition

on:
  workflow_dispatch: {}
  # Daily at 14:43 UTC (07:43 PDT, 06:43 PST).
  schedule:
    - cron: "43 14 * * *"

permissions:
  contents: write   # commit the new edition back to the repo
  id-token: write   # GitHub OIDC token for Anthropic federation; no API key

concurrency:
  group: daily-edition
  cancel-in-progress: false

jobs:
  edition:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Fetch GitHub OIDC token for Anthropic
        run: |
          curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$RUNNER_TEMP/anthropic-jwt"
      - name: Generate edition
        env:
          ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-jwt
        run: python -m newsletter.run
      - name: Commit data
        run: |
          git config user.name "today-in-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data logs
          git diff --cached --quiet || git commit -m "Edition $(TZ=America/Los_Angeles date +%F)"
          git push
      - run: python -m newsletter.build --strict
      - name: Stage Pages site
        run: mkdir -p _site && cp dist/ainews.html _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }

  pages:
    needs: edition
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
